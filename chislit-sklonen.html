<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Склонение ЧИСЛИТЕЛЬНЫХ под Новый год ❄️</title>
    <style>
        :root {
            --primary: #c0392b; 
            --secondary: #27ae60; 
            --bg: #1a2a6c; 
            --text: #2c3e50;
            --white: #ffffff;
            --ice: #e3f2fd;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, sans-serif; 
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f); 
            background-attachment: fixed;
            color: var(--text); 
            display: flex; 
            justify-content: center; 
            padding: 20px;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .snowflake {
            position: fixed; top: -10%; z-index: 0;
            color: white; font-size: 1.5em; opacity: 0.8;
            user-select: none; pointer-events: none;
            animation: fall linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(110vh) rotate(360deg); }
        }

        .container { 
            background: rgba(255, 255, 255, 0.96); 
            width: 100%; max-width: 600px; 
            padding: 35px; border-radius: 25px; 
            box-shadow: 0 0 40px rgba(0,0,0,0.5); 
            position: relative; z-index: 1;
            border: 4px solid var(--ice);
            margin-top: 20px;
        }

        h1 { text-align: center; color: var(--primary); font-size: 26px; margin-bottom: 10px; }
        .sub-title { text-align: center; color: #555; margin-bottom: 25px; font-style: italic; }

        .screen { display: none; }
        .active { display: block; }

        input[type="text"], select { 
            width: 100%; padding: 14px; margin: 12px 0; 
            border: 2px solid #ced4da; border-radius: 12px; 
            font-size: 16px; box-sizing: border-box;
        }

        .main-btn { 
            width: 100%; padding: 16px; 
            background: linear-gradient(to bottom, var(--secondary), #1e8449);
            color: white; border: none; border-radius: 50px; cursor: pointer; 
            font-size: 18px; font-weight: bold; transition: 0.3s; margin-top: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .main-btn:hover { transform: scale(1.02); filter: brightness(1.1); }

        .opt-btn { 
            background: var(--ice); color: var(--text); text-align: left; 
            padding: 14px; border: 2px solid #bbdefb; border-radius: 15px;
            font-weight: normal; font-size: 16px; width: 100%; margin-top: 8px;
            cursor: pointer; transition: 0.2s;
        }
        .opt-btn:hover { background: #d0e8f9; }

        .correct { background: #2ecc71 !important; color: white !important; border-color: #27ae60 !important; }
        .wrong { background: #e74c3c !important; color: white !important; border-color: #c0392b !important; }

        .explanation { 
            margin-top: 15px; padding: 15px; border-radius: 12px; 
            background: #fff9c4; border-left: 6px solid var(--primary); 
            display: none; font-size: 15px; line-height: 1.5;
        }

        .progress-bar { height: 12px; background: #eee; border-radius: 10px; margin-bottom: 20px; overflow: hidden; border: 1px solid #ddd; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #27ae60, #2ecc71); width: 0%; transition: 0.5s; }
        
        #next-btn { background: var(--primary); }
        .stats { font-weight: bold; color: #34495e; margin-bottom: 10px; }
    </style>
</head>
<body>

<div class="container">
    <div id="start-screen" class="screen active">
        <h1>❄️ Склонение ЧИСЛИТЕЛЬНЫХ под Новый год ❄️</h1>
        <p class="sub-title">Праздничный тренажер</p>
        <input type="text" id="user-name" placeholder="Ваше имя...">
        <select id="level-select">
            <option value="1">Уровень 1: Сотни</option>
            <option value="2">Уровень 2: Составные (3-значные)</option>
            <option value="3">Уровень 3: Порядковые и сложные</option>
            <option value="4">Уровень 4: Дроби и согласование</option>
            <option value="all">Весь праздничный микс (48 вопросов)</option>
        </select>
        <button class="main-btn" onclick="startGame()">Начать сказку ✨</button>
    </div>

    <div id="quiz-screen" class="screen">
        <div class="stats">
            <span id="display-name"></span>
            <span style="float:right">🎁 Баллов: <span id="score">0</span></span>
        </div>
        <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
        <div id="question-text" style="font-weight:bold; font-size:19px; margin-bottom:15px;"></div>
        <div id="options-container"></div>
        <div id="explanation-box" class="explanation"></div>
        <button id="next-btn" class="main-btn" style="display:none;" onclick="nextQuestion()">Далее 🎅</button>
    </div>

    <div id="end-screen" class="screen">
        <h1 style="font-size:40px">🎄 Ура!</h1>
        <div id="final-result" style="text-align:center; font-size: 20px; margin: 25px 0; line-height: 1.5;"></div>
        <button class="main-btn" onclick="location.reload()">На главную 🍬</button>
    </div>
</div>

<script>
    const allQuestions = [
        // LEVEL 1: СОТНИ
        { level: 1, q: "Как правильно: «В 600 километрах»?", options: ["шестистах", "шестиста", "шестисот", "шестисотах"], correct: "шестистах", exp: "П.п.: в шести + стах." },
        { level: 1, q: "К 300 прибавить 100:", options: ["трёмстам", "трёмста", "трёхстам", "тремястам"], correct: "трёмстам", exp: "Д.п.: трём + стам." },
        { level: 1, q: "Гордиться 800 участниками:", options: ["восьмьюстами", "восемьюста", "восемьстами", "восьмистами"], correct: "восьмьюстами", exp: "Т.п.: восьмью + стами." },
        { level: 1, q: "Располагать 500 рублями:", options: ["пятьюстами", "пятистами", "пятьюсотами", "пятьюста"], correct: "пятьюстами", exp: "Т.п.: пятью + стами." },
        { level: 1, q: "Без 400 голосов:", options: ["четырёхсот", "четырёхста", "четыресто", "четыреста"], correct: "четырёхсот", exp: "Р.п.: четырёх + сот." },
        { level: 1, q: "Скучать по 200 друзьям:", options: ["двумстам", "двумста", "двухстам", "двухста"], correct: "двумстам", exp: "Д.п.: двум + стам." },
        { level: 1, q: "В 900 экземплярах:", options: ["девятистах", "девятиста", "девятьсот", "девятисот"], correct: "девятистах", exp: "П.п.: девяти + стах." },
        { level: 1, q: "Доволен 700 баллами:", options: ["семьюстами", "семистами", "семиста", "семьюста"], correct: "семьюстами", exp: "Т.п.: семью + стами." },
        { level: 1, q: "Нет 100 рублей:", options: ["ста", "сто", "сот", "сота"], correct: "ста", exp: "У 'сто' в косвенных падежах форма 'ста'." },
        { level: 1, q: "О 500 случаях:", options: ["пятистах", "пятиста", "пятисотах", "пятисот"], correct: "пятистах", exp: "П.п.: пяти + стах." },
        { level: 1, q: "Более 400 метров:", options: ["четырёхсот", "четырёхста", "четыреста", "четырёхстах"], correct: "четырёхсот", exp: "Р.п.: четырёх + сот." },
        { level: 1, q: "Доволен 200 результатами:", options: ["двумястами", "двумяста", "двухстами", "двумстами"], correct: "двумястами", exp: "Т.п.: двумя + стами." },
        
        // LEVEL 2: СОСТАВНЫЕ
        { level: 2, q: "Со всеми 243 стульями:", options: ["двумястами сорока тремя", "двухстами сорока тремя", "двухсот сорок тремя", "двести сорока тремя"], correct: "двумястами сорока тремя", exp: "Склоняем каждое слово!" },
        { level: 2, q: "Более 857 человек:", options: ["восьмисот пятидесяти семи", "восьмиста пятидесяти семи", "восемьсот пятидесяти семи", "восьмисот пятьдесят семи"], correct: "восьмисот пятидесяти семи", exp: "Р.п. для всех частей числа." },
        { level: 2, q: "Располагать 692 рублями:", options: ["шестьюстами девяноста двумя", "шестистами девяноста двумя", "шестьюста девяносто двумя", "шестисот девяноста двумя"], correct: "шестьюстами девяноста двумя", exp: "90 -> девяноста." },
        { level: 2, q: "К 438 прибавить 10:", options: ["четырёмстам тридцати восьми", "четыреста тридцати восьми", "четырёмста тридцати восьми", "четырёмстам тридцать восьми"], correct: "четырёмстам тридцати восьми", exp: "Д.п. для каждой части." },
        { level: 2, q: "Доволен 719 баллами:", options: ["семьюстами девятнадцатью", "семистами девятнадцатью", "семьюстами девятнадцати", "семьюста девятнадцатью"], correct: "семьюстами девятнадцатью", exp: "Т.п.: семьюстами + девятнадцатью." },
        { level: 2, q: "В 564 письмах:", options: ["пятистах шестидесяти четырёх", "пятиста шестидесяти четырёх", "пятьюстах шестидесяти четырёх", "пятисот шестидесяти четырёх"], correct: "пятистах шестидесяти четырёх", exp: "П.п. для всех частей." },
        { level: 2, q: "Гордиться 385 участниками:", options: ["тремястами восьмьюдесятью пятью", "трёхстами восьмидесятью пятью", "тремяста восемьюдесятью пятью", "тремястами восьмидесятью пятью"], correct: "тремястами восьмьюдесятью пятью", exp: "Т.п.: тремястами + восьмьюдесятью + пятью." },
        { level: 2, q: "Нет 940 страниц:", options: ["девятисот сорока", "девятиста сорока", "девятьсот сорока", "девятисот сорок"], correct: "девятисот сорока", exp: "Р.п.: девятисот сорока." },
        { level: 2, q: "С 555 подарками:", options: ["пятьюстами пятьюдесятью пятью", "пятистами пятьюдесятью пятью", "пятьюстами пятьдесят пятью", "пятистами пятидесяти пятью"], correct: "пятьюстами пятьюдесятью пятью", exp: "Все части в Т.п." },
        { level: 2, q: "О 777 случаях:", options: ["семистах семидесяти семи", "семиста семидесяти семи", "семисот семидесяти семи", "семьсот семидесяти семи"], correct: "семистах семидесяти семи", exp: "Все части в П.п." },
        { level: 2, q: "С 459 жителями:", options: ["четырьмястами пятьюдесятью девятью", "четыреста пятьюдесятью девятью", "четырёхста пятьдесят девятью", "четырехстами пятидесяти девятью"], correct: "четырьмястами пятьюдесятью девятью", exp: "Т.п. всех частей." },
        { level: 2, q: "Более 325 метров:", options: ["трёхсот двадцати пяти", "трёхста двадцати пяти", "триста двадцати пяти", "трёхсот двудцати пяти"], correct: "трёхсот двадцати пяти", exp: "Р.п. всех частей." },

        // LEVEL 3: ПОРЯДКОВЫЕ
        { level: 3, q: "События 1812 года:", options: ["тысяча восемьсот двенадцатого", "тысячи восьмисот двенадцатого", "тысяча восьмиста двенадцатого", "одна тысяча восемьсот двенадцатого"], correct: "тысяча восемьсот двенадцатого", exp: "Порядковое: меняем только конец." },
        { level: 3, q: "(200)тысячный тираж:", options: ["двухсоттысячный", "двухстатысячный", "двухсототысячный", "двеститысячный"], correct: "двухсоттысячный", exp: "Сложное слово: Р.п. (двухсот)." },
        { level: 3, q: "В (2547) году:", options: ["две тысячи пятьсот сорок седьмом", "двух тысяч пятистах сорок седьмом", "две тысячи пятьсот сорока седьмом", "двухтысяче пятьсот сорок седьмом"], correct: "две тысячи пятьсот сорок седьмом", exp: "Меняем только 'седьмом'." },
        { level: 3, q: "(90)летняя годовщина:", options: ["девяностолетняя", "девяносталетняя", "девятидесятилетняя", "девяносто-летняя"], correct: "девяностолетняя", exp: "90 и 100 в сложных словах не меняются." },
        { level: 3, q: "О (465-й) странице:", options: ["четыреста шестьдесят пятой", "четырёхстах шестидесяти пятой", "четырёхсот шестьдесят пятой", "четыреста шестидесяти пятой"], correct: "четыреста шестьдесят пятой", exp: "Порядковое: меняем конец." },
        { level: 3, q: "(500)миллионный житель:", options: ["пятисотмиллионный", "пятистамиллионный", "пятьсотмиллионный", "пятьсот миллионный"], correct: "пятисотмиллионный", exp: "Р.п. основы: пятисот." },
        { level: 3, q: "К (740-му) участнику:", options: ["семьсот сороковому", "семиста сороковому", "семисот сороковому", "семьсотсороковому"], correct: "семьсот сороковому", exp: "Меняем только 'сороковому'." },
        { level: 3, q: "(40)градусный мороз:", options: ["сорокаградусный", "сорокградусный", "сорокоградусный", "сорока-градусный"], correct: "сорокаградусный", exp: "40 -> сорока." },
        { level: 3, q: "До (398-й) страницы:", options: ["триста девяносто восьмой", "трёхсот девяноста восьмой", "триста девяноста восьмой", "трёхсот девяносто восьмой"], correct: "триста девяносто восьмой", exp: "Меняем только конец." },
        { level: 3, q: "(80)тонный груз:", options: ["восьмидесятитонный", "восемьдесятитонный", "восьмидесяттонный", "восьмидесяти-тонный"], correct: "восьмидесятитонный", exp: "Р.п. первой части." },
        { level: 3, q: "(100)метровая дистанция:", options: ["стометровая", "стаметровая", "сотнеметровая", "сто-метровая"], correct: "стометровая", exp: "100 не меняется в составе сложных слов." },
        { level: 3, q: "В (600-м) номере:", options: ["шестисотом", "шестистахсотом", "шестьюсотом", "шестьсотом"], correct: "шестисотом", exp: "Порядковое сложное: шести(Р.п.)сотый." },

        // LEVEL 4: ДРОБИ
        { level: 4, q: "Отрезать (2 3/4) метра:", options: ["две целых три четвёртых метра", "две целых три четвёртых метров", "два целых три четвёртых метра", "два целых три четвёртых метров"], correct: "две целых три четвёртых метра", exp: "Дробь + Р.п. ед.ч." },
        { level: 4, q: "К (1,5) стаканам молока:", options: ["полутора", "полтора", "полторам", "полуторам"], correct: "полутора", exp: "Д.п. — полутора." },
        { level: 4, q: "Добавить к (0,5) литра:", options: ["нолю целых пяти десятым литра", "нолю целых пяти десятым литров", "нолю целым пяти десятых литра", "нолю целым пяти десятым литра"], correct: "нолю целых пяти десятым литра", exp: "Существительное при дроби в ед.ч." },
        { level: 4, q: "Выехать с (1 1/2) килограмм(?):", options: ["полутора килограммами", "полтора килограмма", "полутора килограммов", "полторами килограммами"], correct: "полутора килограммами", exp: "Т.п. — полутора." },
        { level: 4, q: "Более (5,2) гектар(?):", options: ["пяти целых двух десятых гектара", "пяти целых двух десятых гектаров", "пять целых две десятых гектара", "пяти целых двух десятых гектар"], correct: "пяти целых двух десятых гектара", exp: "Гектара (ед.ч.)." },
        { level: 4, q: "С (2 1/3) стакан(?):", options: ["двумя целыми одной третьей стакана", "двумя целыми одной третьей стаканов", "двумя целых одной третьих стакана", "двумя целыми одной третьей стаканами"], correct: "двумя целыми одной третьей стакана", exp: "Стакана (ед.ч.), целых и знаменатель склоняются= прилагательные" },
        { level: 4, q: "Пользоваться (3/5) участк(?):", options: ["тремя пятыми участка", "тремя пятыми участков", "тремя пятых участка", "тремя пятых участков"], correct: "тремя пятыми участка", exp: "Участка (ед.ч.)." },
        { level: 4, q: "Расстояние в (4,8) километр(?):", options: ["четыре целых восемь десятых километра", "четыре целых восемь десятых километров", "четыре целые восемь десятых километра", "четыре целые восемь десятых километров"], correct: "четыре целых восемь десятых километра", exp: "Километра (ед.ч.)." },
        { level: 4, q: "Не хватает (1/2) чайн(?) лож(?):", options: ["пол чайной ложки", "полчайной ложки", "пол чайной ложек", "пол-чайной ложки"], correct: "пол чайной ложки", exp: "ПОЛ- относится к слову ложки (ед.ч.)." },
        { level: 4, q: "250-й юбилей:", options: ["двести пятидесятый", "двестипятидесятый", "двухсотпятидесятый", "двухсот пятидесятый"], correct: "двести пятидесятый", exp: "порядковое числительное склоняется лишь в конце" },
        { level: 4, q: "25000-й экземпляр:", options: ["двадцатипятитысячный", "двадцати пятитысячный", "двадцатипяти тысячный","двадцати пяти тысячный"], correct: "двадцатипятитысячный", exp: "на -тысячный слитно, числит. встраиваются в Р.падеже" },
        { level: 4, q: "250-летие:", options: ["двухсотпятидесятилетие", "двестипятидесятилетие", "двухсот пятидесятилетие", "двести пятидесяти летие"], correct: "двухсотпятидесятилетие", exp: "в сложном слове числительные в род. падеже слитно" }
    ];

    let currentQuestions = []; let qIndex = 0; let score = 0; let userName = "";

    function createSnow() {
        for(let i=0; i<35; i++) {
            let flake = document.createElement('div');
            flake.className = 'snowflake';
            flake.innerText = '❄';
            flake.style.left = Math.random() * 100 + 'vw';
            flake.style.animationDuration = (Math.random() * 3 + 7) + 's';
            flake.style.opacity = Math.random();
            document.body.appendChild(flake);
        }
    }
    createSnow();

    function startGame() {
        userName = document.getElementById('user-name').value || "Ученик";
        const level = document.getElementById('level-select').value;
        currentQuestions = level === 'all' ? [...allQuestions].sort(() => Math.random() - 0.5) : allQuestions.filter(q => q.level == level);
        document.getElementById('start-screen').classList.remove('active');
        document.getElementById('quiz-screen').classList.add('active');
        document.getElementById('display-name').innerText = "🎄 " + userName;
        qIndex = 0; score = 0; document.getElementById('score').innerText = "0";
        showQuestion();
    }

    function showQuestion() {
        const q = currentQuestions[qIndex];
        document.getElementById('question-text').innerHTML = "Вопрос " + (qIndex + 1) + ": " + q.q;
        const container = document.getElementById('options-container');
        container.innerHTML = "";
        document.getElementById('explanation-box').style.display = "none";
        document.getElementById('next-btn').style.display = "none";
        const shuffled = [...q.options].sort(() => Math.random() - 0.5);
        shuffled.forEach(opt => {
            const btn = document.createElement('button');
            btn.innerText = opt;
            btn.className = 'opt-btn';
            btn.onclick = () => checkAnswer(opt, q.correct);
            container.appendChild(btn);
        });
        updateProgress();
    }

    function checkAnswer(sel, cor) {
        const buttons = document.querySelectorAll('.opt-btn');
        buttons.forEach(b => {
            b.disabled = true;
            if(b.innerText === cor) b.classList.add('correct');
            if(b.innerText === sel && sel !== cor) b.classList.add('wrong');
        });
        if(sel === cor) { score++; document.getElementById('score').innerText = score; }
        const expBox = document.getElementById('explanation-box');
        expBox.innerText = currentQuestions[qIndex].exp;
        expBox.style.display = "block";
        document.getElementById('next-btn').style.display = "block";
    }

    function nextQuestion() {
        qIndex++;
        if(qIndex < currentQuestions.length) showQuestion();
        else showEndScreen();
    }

    function updateProgress() {
        document.getElementById('progress-fill').style.width = (qIndex / currentQuestions.length) * 100 + "%";
    }

    function showEndScreen() {
        document.getElementById('quiz-screen').classList.remove('active');
        document.getElementById('end-screen').classList.add('active');
        
        let message = "";
        const total = currentQuestions.length;

        // Если уровень стандартный (12 вопросов)
        if (total === 12) {
            if (score === 12) {
                message = "Отлично! 12 из 12! Поздравляю! 🏆";
            } else if (score >= 10) {
                message = "Неплохо, но будь внимательнее! 🎄";
            } else {
                message = "Надо повторить склонение числительных и пройти уровень заново! ❄️";
            }
        } 
        // Если это "Весь микс" (48 вопросов), используем пропорцию
        else {
            const percent = (score / total) * 100;
            if (percent === 100) {
                message = "Великолепно! Все числительные покорены! 🏆";
            } else if (percent >= 80) {
                message = "Очень хороший результат, почти идеал! 🎄";
            } else {
                message = "Похоже, стоит еще немного потренироваться. ❄️";
            }
        }

        document.getElementById('final-result').innerHTML = `🎁 <b>${userName}</b>, ваш итог:<br><br><span style="font-size:32px; color:#27ae60">${score} из ${total} баллов</span><br><br>${message}`;
    }
</script>
</body>
</html>
