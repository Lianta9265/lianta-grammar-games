<!doctype html>
<html lang="ru">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Игра на написание наречий</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      height: 100%;
      overflow: hidden;
    }

    * {
      box-sizing: border-box;
    }

    .game-container {
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 15px;
    }

    .header {
      text-align: center;
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .header h1 {
      margin: 0 0 10px 0;
      font-size: 32px;
    }

    .turn-indicator {
      background: white;
      padding: 12px 24px;
      border-radius: 12px;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      display: inline-block;
    }

    .turn-red {
      color: #dc2626;
    }

    .turn-blue {
      color: #2563eb;
    }

    .scoreboard {
      display: flex;
      justify-content: space-around;
      gap: 20px;
      margin: 0 auto;
      max-width: 600px;
      width: 100%;
    }

    .score-card {
      flex: 1;
      background: white;
      padding: 20px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
    }

    .score-card.red {
      border: 4px solid #dc2626;
    }

    .score-card.blue {
      border: 4px solid #2563eb;
    }

    .team-name {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .team-name.red {
      color: #dc2626;
    }

    .team-name.blue {
      color: #2563eb;
    }

    .score {
      font-size: 48px;
      font-weight: bold;
      color: #1f2937;
    }

    .question-area {
      flex: 1;
      background: white;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .question-text {
      font-size: 24px;
      font-weight: bold;
      color: #1f2937;
      text-align: center;
      margin-bottom: 10px;
    }

    .options-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .option-card {
      background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      border: 3px solid transparent;
      color: #1f2937;
    }

    .option-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      background: linear-gradient(135deg, #dbeafe 0%, #bfdbfe 100%);
    }

    .option-card.correct {
      background: linear-gradient(135deg, #86efac 0%, #4ade80 100%);
      border-color: #16a34a;
      animation: correctPulse 0.5s ease;
    }

    .option-card.incorrect {
      background: linear-gradient(135deg, #fca5a5 0%, #f87171 100%);
      border-color: #dc2626;
      animation: incorrectShake 0.5s ease;
    }

    @keyframes correctPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    @keyframes incorrectShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }

    .feedback {
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      padding: 15px;
      border-radius: 12px;
      margin-top: 15px;
    }

    .feedback.correct {
      background: #86efac;
      color: #166534;
    }

    .feedback.incorrect {
      background: #fca5a5;
      color: #991b1b;
    }

    .next-button {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      padding: 15px 40px;
      border-radius: 12px;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      margin: 20px auto 0;
      display: block;
      box-shadow: 0 4px 6px rgba(0,0,0,0.2);
      transition: all 0.3s ease;
    }

    .next-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(0,0,0,0.3);
    }

    .game-over {
      text-align: center;
      padding: 40px;
    }

    .game-over h2 {
      font-size: 36px;
      color: #1f2937;
      margin-bottom: 20px;
    }

    .final-score {
      font-size: 28px;
      color: #4b5563;
      margin-top: 20px;
    }

    .progress {
      text-align: center;
      color: #6b7280;
      font-size: 16px;
      margin-top: 10px;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
 </head>
 <body>
  <div class="game-container">
   <div class="header">
    <h1 id="gameTitle">Игра на написание наречий</h1>
    <div class="turn-indicator" id="turnIndicator">
     Ход команды <span id="currentTeam">Красные</span>!
    </div>
   </div>
   <div class="scoreboard">
    <div class="score-card red">
     <div class="team-name red" id="redTeamName">
      Красная команда
     </div>
     <div class="score" id="redScore">
      0
     </div>
    </div>
    <div class="score-card blue">
     <div class="team-name blue" id="blueTeamName">
      Синяя команда
     </div>
     <div class="score" id="blueScore">
      0
     </div>
    </div>
   </div>
   <div class="question-area" id="questionArea">
    <div class="question-text" id="questionText"></div>
    <div class="options-grid" id="optionsGrid"></div>
    <div id="feedbackArea"></div>
    <div class="progress" id="progressText"></div>
   </div>
  </div>
  <script>
    const defaultConfig = {
      game_title: "Игра на написание наречий",
      red_team_name: "Красная команда",
      blue_team_name: "Синяя команда"
    };

    const words = {
      together: ["СПЛЕЧА", "СРАЗУ", "СЛЕВА", "СБОКУ", "СНАЧАЛА", "СПРАВА", "СНАРУЖИ", "СНОВА", "СЗАДИ", "СВЕРХУ", "СНИЗУ", "СОВСЕМ", "ОТКУДА", "ИЗДАВНА", "ОТЧАСТИ", "ИЗНУТРИ", "ИЗДАЛЕКА"],
      separate: ["С ВИДУ", "С РАЗМАХУ", "С ХОДУ", "СО ВРЕМЕНЕМ", "С РАЗБЕГУ", "С ПОЛУСЛОВА", "БЕЗ ТОЛКУ", "БЕЗ СПРОСУ", "БЕЗ РАЗБОРУ", "БЕЗ УМОЛКУ", "БЕЗ ОГЛЯДКИ", "С БОКУ НА БОК", "С НАСКОКА", "С ПЕРЕПУГУ", "С НАЧАЛА ДО КОНЦА"]
    };

    let gameState = {
      currentTeam: 'red',
      redScore: 0,
      blueScore: 0,
      questionIndex: 0,
      questions: [],
      answered: false
    };

    function extractPrefix(word) {
      // Специальная обработка для слов с "СО"
      if (word === 'СОВСЕМ') {
        return { prefix: 'СО', rest: 'ВСЕМ' };
      }
      if (word === 'СО ВРЕМЕНЕМ') {
        return { prefix: 'СО', rest: 'ВРЕМЕНЕМ' };
      }
      
      const prefixes = ['СО', 'С', 'БЕЗ', 'ОТ', 'ИЗ'];
      for (let prefix of prefixes) {
        if (word.startsWith(prefix + ' ')) {
          const rest = word.substring(prefix.length).trim();
          return { prefix, rest };
        }
        if (word.startsWith(prefix) && prefix !== 'СО') {
          const rest = word.substring(prefix.length).trim();
          return { prefix, rest };
        }
      }
      return { prefix: '', rest: word };
    }

    function formatWordWithBrackets(word) {
      const parts = extractPrefix(word);
      if (parts.prefix) {
        return `(${parts.prefix.toLowerCase()})${parts.rest.toLowerCase()}`;
      }
      return word.toLowerCase();
    }

    function generateQuestions() {
      const questions = [];
      
      words.separate.forEach(correctWord => {
        const incorrectOptions = [];
        while (incorrectOptions.length < 2) {
          const randomWord = words.together[Math.floor(Math.random() * words.together.length)];
          if (!incorrectOptions.includes(randomWord)) {
            incorrectOptions.push(randomWord);
          }
        }
        
        const options = [correctWord, ...incorrectOptions].sort(() => Math.random() - 0.5);
        questions.push({
          question: "Выбери наречие, которое пишется раздельно",
          options: options.map(formatWordWithBrackets),
          correctAnswer: formatWordWithBrackets(correctWord),
          type: 'separate'
        });
      });
      
      words.together.forEach(correctWord => {
        const incorrectOptions = [];
        while (incorrectOptions.length < 2) {
          const randomWord = words.separate[Math.floor(Math.random() * words.separate.length)];
          if (!incorrectOptions.includes(randomWord)) {
            incorrectOptions.push(randomWord);
          }
        }
        
        const options = [correctWord, ...incorrectOptions].sort(() => Math.random() - 0.5);
        questions.push({
          question: "Выбери наречие, которое пишется слитно",
          options: options.map(formatWordWithBrackets),
          correctAnswer: formatWordWithBrackets(correctWord),
          type: 'together'
        });
      });
      
      return questions.sort(() => Math.random() - 0.5);
    }

    function displayQuestion() {
      if (gameState.questionIndex >= gameState.questions.length) {
        showGameOver();
        return;
      }

      const question = gameState.questions[gameState.questionIndex];
      const questionText = document.getElementById('questionText');
      const optionsGrid = document.getElementById('optionsGrid');
      const feedbackArea = document.getElementById('feedbackArea');
      const progressText = document.getElementById('progressText');

      questionText.textContent = question.question;
      feedbackArea.innerHTML = '';
      gameState.answered = false;

      optionsGrid.innerHTML = '';
      question.options.forEach(option => {
        const optionCard = document.createElement('div');
        optionCard.className = 'option-card';
        optionCard.textContent = option;
        optionCard.onclick = () => handleAnswer(option, question.correctAnswer);
        optionsGrid.appendChild(optionCard);
      });

      progressText.textContent = `Вопрос ${gameState.questionIndex + 1} из ${gameState.questions.length}`;
      updateTurnIndicator();
    }

    function handleAnswer(selected, correct) {
      if (gameState.answered) return;
      gameState.answered = true;

      const optionCards = document.querySelectorAll('.option-card');
      const feedbackArea = document.getElementById('feedbackArea');
      const isCorrect = selected === correct;

      optionCards.forEach(card => {
        card.style.pointerEvents = 'none';
        if (card.textContent === selected) {
          card.classList.add(isCorrect ? 'correct' : 'incorrect');
        }
        if (card.textContent === correct && !isCorrect) {
          card.classList.add('correct');
        }
      });

      if (isCorrect) {
        if (gameState.currentTeam === 'red') {
          gameState.redScore++;
        } else {
          gameState.blueScore++;
        }
        feedbackArea.innerHTML = '<div class="feedback correct">✓ Правильно! +1 балл</div>';
      } else {
        if (gameState.currentTeam === 'red') {
          gameState.redScore--;
        } else {
          gameState.blueScore--;
        }
        feedbackArea.innerHTML = '<div class="feedback incorrect">✗ Неправильно! -1 балл</div>';
      }

      updateScores();

      const nextButton = document.createElement('button');
      nextButton.className = 'next-button';
      nextButton.textContent = 'Следующий вопрос';
      nextButton.onclick = nextQuestion;
      feedbackArea.appendChild(nextButton);
    }

    function nextQuestion() {
      gameState.currentTeam = gameState.currentTeam === 'red' ? 'blue' : 'red';
      gameState.questionIndex++;
      displayQuestion();
    }

    function updateScores() {
      document.getElementById('redScore').textContent = gameState.redScore;
      document.getElementById('blueScore').textContent = gameState.blueScore;
    }

    function updateTurnIndicator() {
      const indicator = document.getElementById('turnIndicator');
      const teamSpan = document.getElementById('currentTeam');
      const config = window.elementSdk?.config || defaultConfig;
      
      if (gameState.currentTeam === 'red') {
        teamSpan.textContent = config.red_team_name || defaultConfig.red_team_name;
        indicator.className = 'turn-indicator turn-red';
      } else {
        teamSpan.textContent = config.blue_team_name || defaultConfig.blue_team_name;
        indicator.className = 'turn-indicator turn-blue';
      }
    }

    function showGameOver() {
      const questionArea = document.getElementById('questionArea');
      const config = window.elementSdk?.config || defaultConfig;
      
      let resultText = '';
      if (gameState.redScore > gameState.blueScore) {
        resultText = `🏆 Побеждает ${config.red_team_name || defaultConfig.red_team_name}!`;
      } else if (gameState.blueScore > gameState.redScore) {
        resultText = `🏆 Побеждает ${config.blue_team_name || defaultConfig.blue_team_name}!`;
      } else {
        resultText = '🤝 Ничья!';
      }

      questionArea.innerHTML = `
        <div class="game-over">
          <h2>${resultText}</h2>
          <div class="final-score">
            <strong>Итоговый счёт:</strong><br>
            ${config.red_team_name || defaultConfig.red_team_name}: ${gameState.redScore}<br>
            ${config.blue_team_name || defaultConfig.blue_team_name}: ${gameState.blueScore}
          </div>
        </div>
      `;

      document.getElementById('turnIndicator').style.display = 'none';
    }

    async function onConfigChange(config) {
      document.getElementById('gameTitle').textContent = config.game_title || defaultConfig.game_title;
      document.getElementById('redTeamName').textContent = config.red_team_name || defaultConfig.red_team_name;
      document.getElementById('blueTeamName').textContent = config.blue_team_name || defaultConfig.blue_team_name;
      updateTurnIndicator();
    }

    function initGame() {
      gameState.questions = generateQuestions();
      displayQuestion();
      onConfigChange(defaultConfig);
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["game_title", config.game_title || defaultConfig.game_title],
          ["red_team_name", config.red_team_name || defaultConfig.red_team_name],
          ["blue_team_name", config.blue_team_name || defaultConfig.blue_team_name]
        ])
      });
    }

    initGame();
  </script>
