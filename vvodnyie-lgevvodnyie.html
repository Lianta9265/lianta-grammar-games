<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мерцающий Космос: Вводные Слова 🌌</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100vh; /* 🔑 КЛЮЧЕВОЕ ИЗМЕНЕНИЕ */
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* === ФОН: ТИХИЕ МЕРЦАЮЩИЕ ЗВЁЗДЫ === */
    #balloonContainer {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #balloonContainer::before {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(to bottom, #0b0e2a, #030510);
      z-index: -3;
    }

    .star-field {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: -2;
      pointer-events: none;
    }

    .twinkling-star {
      position: absolute;
      width: 2px; height: 2px;
      background: #fff;
      border-radius: 50%;
      opacity: 0;
      animation: fadeTwinkle 6s ease-in-out infinite;
    }

    .twinkling-star.s2 { width: 3px; height: 3px; }
    .twinkling-star.s3 { width: 4px; height: 4px; }

    .twinkling-star.gold { background: #e6c229; }
    .twinkling-star.cyan { background: #a0d8ff; }

    @keyframes fadeTwinkle {
      0% { opacity: 0; transform: scale(0.8); }
      20% { opacity: 0.3; transform: scale(1); }
      40% { opacity: 0.8; }
      60% { opacity: 0.3; }
      80% { opacity: 0; transform: scale(0.8); }
      100% { opacity: 0; }
    }

    /* === ИГРОВЫЕ ЭЛЕМЕНТЫ === */
    .score-counter-genially {
      position: absolute;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255, 255, 255, 0.95);
      border-radius: 20px;
      padding: 10px 20px;
      box-shadow: 0 5px 17px rgba(0,0,0,0.3);
      z-index: 3000;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: bold;
      display: flex;
      gap: 15px;
      border: 2px solid #667eea;
    }

    .correct-score-genially { color: #4CAF50; }
    .incorrect-score-genially { color: #f44336; }

    .balloon-genially {
      position: absolute;
      width: 96px;
      height: 120px;
      cursor: pointer;
      transition: transform 0.2s ease;
      z-index: 1000;
      user-select: none;
    }

    .balloon-genially:hover {
      transform: scale(1.15);
    }

    .balloon-image-genially {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
    }

    .mini-balloon-genially {
      position: absolute;
      width: 27px;
      height: 33.5px;
      pointer-events: none;
      z-index: 999;
      animation: floatUpGenially 2s ease-out forwards;
    }

    @keyframes floatUpGenially {
      0% { transform: translate(0, 0) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0.2); opacity: 0; }
    }

    .question-popup-genially {
      position: absolute;
      top: 50px;
      left: 50%;
      background: white;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 11px 33px rgba(0,0,0,0.3);
      z-index: 2000;
      text-align: center;
      min-width: 300px;
      max-width: 400px;
      transform: translateX(-50%);
      font-family: Arial, sans-serif;
      border: 2px solid #667eea;
      opacity: 1;
      transition: opacity 0.5s ease;
    }

    .question-text-genially {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }

    .answer-button-genially {
      display: inline-block;
      margin: 5px;
      padding: 10px 20px;
      background: white;
      color: #667eea;
      border: 2px solid #667eea;
      border-radius: 25px;
      cursor: pointer;
      font-size: 16px;
      font-weight: bold;
      transition: all 0.3s ease;
      min-width: 120px;
    }

    .answer-button-genially:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
      background: #f0f4ff;
    }

    .correct-answer-genially {
      border-color: #4CAF50 !important;
      color: #4CAF50 !important;
    }

    .correct-answer-genially:hover {
      background: #f1f8e9 !important;
      box-shadow: 0 5px 15px rgba(76, 175, 80, 0.3) !important;
    }

    .incorrect-answer-genially {
      border-color: #f44336 !important;
      color: #f44336 !important;
    }

    .incorrect-answer-genially:hover {
      background: #ffebee !important;
      box-shadow: 0 5px 15px rgba(244, 67, 54, 0.3) !important;
    }

    .feedback-text-genially {
      font-size: 16px;
      font-weight: bold;
      margin-top: 10px;
      padding: 8px;
      border-radius: 8px;
    }

    .correct-feedback-genially {
      background: #e8f5e9;
      color: #2e7d32;
      border: 2px solid #4CAF50;
    }

    .incorrect-feedback-genially {
      background: #ffebee;
      color: #c62828;
      border: 2px solid #f44336;
    }
  </style>
</head>
<body>

<!-- ✅ Контейнер теперь ВНУТРИ body и растянут -->
<div id="balloonContainer"></div>

<script>
(function() {
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initGame);
    } else {
        initGame();
    }

    function initGame() {
        let correctAnswers = 0;
        let incorrectAnswers = 0;
        let scoreCounterElement = null;
        const allBalloons = [];

        const inputWords = [
            "по-видимому", "безусловно", "без сомнения", "бесспорно", "естественно",
            "вероятно", "возможно", "должно быть", "видимо", "наверное", "очевидно",
            "пожалуй", "скорее всего", "по всей вероятности", "похоже"
        ];

        const fakeInputWords = [
            "авось", "небось", "наверняка", "как будто", "едва ли", "вряд ли",
            "приблизительно", "примерно", "решительно", "по возможности", "обязательно",
            "якобы", "поистине", "более или менее", "вроде"
        ];

        let inputPool = [...inputWords];
        let fakeInputPool = [...fakeInputWords];

        function getRandomInputWord() {
            if (inputPool.length === 0) inputPool = [...inputWords];
            const index = Math.floor(Math.random() * inputPool.length);
            return inputPool.splice(index, 1)[0];
        }

        function getRandomFakeInputWord() {
            if (fakeInputPool.length === 0) fakeInputPool = [...fakeInputWords];
            const index = Math.floor(Math.random() * fakeInputPool.length);
            return fakeInputPool.splice(index, 1)[0];
        }

        function createTwinklingStars(container) {
            const starField = document.createElement('div');
            starField.className = 'star-field';
            container.appendChild(starField);

            const count = 150;
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'twinkling-star';

                const size = Math.random() > 0.7 ? 's3' : Math.random() > 0.4 ? 's2' : '';
                if (size) star.classList.add(size);

                const hue = Math.random();
                if (hue < 0.3) star.classList.add('gold');
                else if (hue < 0.6) star.classList.add('cyan');

                const x = Math.random() * 100;
                const y = Math.random() * 100;
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.animationDelay = `${Math.random() * 6}s`;

                starField.appendChild(star);
            }
        }

        function createScoreCounter() {
            const el = document.createElement('div');
            el.className = 'score-counter-genially';
            el.innerHTML = `
                <span class="correct-score-genially">ВЕРНО: ${correctAnswers}</span>
                <span class="incorrect-score-genially">НЕВЕРНО: ${incorrectAnswers}</span>
            `;
            return el;
        }

        function updateScoreCounter() {
            if (scoreCounterElement) {
                scoreCounterElement.innerHTML = `
                    <span class="correct-score-genially">ВЕРНО: ${correctAnswers}</span>
                    <span class="incorrect-score-genially">НЕВЕРНО: ${incorrectAnswers}</span>
                `;
            }
        }

        class BalloonWidget {
            constructor(container, x, y, id, isInputWord) {
                this.container = container;
                this.x = x;
                this.y = y;
                this.id = id;
                this.isInputWord = isInputWord;
                this.balloonElement = null;
                this.vx = (Math.random() - 0.5) * 1.2;
                this.vy = (Math.random() - 0.5) * 1.2;
                this.animationId = null;
                this.init();
            }

            init() {
                this.createBalloon();
                this.startMovement();
            }

            createBalloon() {
                this.balloonElement = document.createElement('div');
                this.balloonElement.className = 'balloon-genially';
                this.balloonElement.style.left = this.x + 'px';
                this.balloonElement.style.top = this.y + 'px';

                const img = document.createElement('img');
                img.src = 'https://media.tenor.com/iO3RcCKrvqcAAAAj/water-bubble-shiny.gif';
                img.className = 'balloon-image-genially';
                this.balloonElement.appendChild(img);

                this.balloonElement.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.pop();
                });
                this.balloonElement.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    this.pop();
                });

                this.container.appendChild(this.balloonElement);
            }

            startMovement() {
                const move = () => {
                    const rect = this.container.getBoundingClientRect();
                    const w = rect.width;
                    const h = rect.height;

                    this.vx += (Math.random() - 0.5) * 0.15;
                    this.vy += (Math.random() - 0.5) * 0.15;

                    const maxSpeed = 1.2;
                    const speed = Math.hypot(this.vx, this.vy);
                    if (speed > maxSpeed) {
                        this.vx = (this.vx / speed) * maxSpeed;
                        this.vy = (this.vy / speed) * maxSpeed;
                    }

                    // Избегание других шариков
                    allBalloons.forEach(other => {
                        if (other.id !== this.id) {
                            const dx = this.x - other.x;
                            const dy = this.y - other.y;
                            const dist = Math.hypot(dx, dy);
                            if (dist < 110 && dist > 0) {
                                const force = (110 - dist) / 110 * 0.15;
                                this.vx += (dx / dist) * force;
                                this.vy += (dy / dist) * force;
                            }
                        }
                    });

                    this.x += this.vx;
                    this.y += this.vy;

                    const margin = 15;
                    if (this.x <= margin) { this.x = margin; this.vx *= -0.75; }
                    if (this.x >= w - 96 - margin) { this.x = w - 96 - margin; this.vx *= -0.75; }
                    if (this.y <= margin) { this.y = margin; this.vy *= -0.75; }
                    if (this.y >= h - 120 - margin) { this.y = h - 120 - margin; this.vy *= -0.75; }

                    if (this.balloonElement) {
                        this.balloonElement.style.left = this.x + 'px';
                        this.balloonElement.style.top = this.y + 'px';
                    }

                    this.animationId = requestAnimationFrame(move);
                };
                this.animationId = requestAnimationFrame(move);
            }

            pop() {
                this.playPopSound();

                for (let i = 0; i < 8; i++) {
                    this.createMiniBalloon(this.x, this.y);
                }

                this.showQuestion(this.container.offsetWidth / 2, 90);

                if (this.balloonElement && this.balloonElement.parentNode) {
                    this.balloonElement.parentNode.removeChild(this.balloonElement);
                }
                if (this.animationId) {
                    cancelAnimationFrame(this.animationId);
                }

                const idx = allBalloons.findIndex(b => b.id === this.id);
                if (idx !== -1) allBalloons.splice(idx, 1);
            }

            playPopSound() {
                try {
                    const ctx = new (window.AudioContext || window.webkitAudioContext)();
                    if (ctx.state === 'suspended') ctx.resume();

                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.frequency.setValueAtTime(600, ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(200, ctx.currentTime + 0.25);

                    gain.gain.setValueAtTime(0.2, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.25);

                    osc.start();
                    osc.stop(ctx.currentTime + 0.25);
                } catch (e) {}
            }

            createMiniBalloon(x, y) {
                const mini = document.createElement('img');
                mini.src = 'https://media.tenor.com/iO3RcCKrvqcAAAAj/water-bubble-shiny.gif';
                mini.className = 'mini-balloon-genially';

                const angle = Math.random() * Math.PI * 2;
                const dist = 70 + Math.random() * 30;
                const tx = Math.cos(angle) * dist;
                const ty = Math.sin(angle) * dist - 30;

                mini.style.setProperty('--tx', tx + 'px');
                mini.style.setProperty('--ty', ty + 'px');
                mini.style.left = (x + 48 - 13.5) + 'px';
                mini.style.top = (y + 60 - 16.75) + 'px';

                this.container.appendChild(mini);
                setTimeout(() => { mini.parentNode?.removeChild(mini); }, 1800);
            }

            showQuestion(x, y) {
                const popup = document.createElement('div');
                popup.className = 'question-popup-genially';
                popup.style.left = x + 'px';

                const word = this.isInputWord ? getRandomInputWord() : getRandomFakeInputWord();
                const questionText = document.createElement('div');
                questionText.className = 'question-text-genially';
                questionText.textContent = word.toUpperCase();

                const answersContainer = document.createElement('div');

                const btn1 = document.createElement('button');
                btn1.className = 'answer-button-genially';
                btn1.textContent = 'Вводное';
                btn1.onclick = (e) => {
                    e.stopPropagation();
                    this.handleAnswer(true, answersContainer, popup);
                };

                const btn2 = document.createElement('button');
                btn2.className = 'answer-button-genially';
                btn2.textContent = 'Лжевводное';
                btn2.onclick = (e) => {
                    e.stopPropagation();
                    this.handleAnswer(false, answersContainer, popup);
                };

                answersContainer.append(btn1, btn2);
                popup.append(questionText, answersContainer);
                this.container.appendChild(popup);
            }

            handleAnswer(isInput, answersContainer, popup) {
                const isCorrect = (isInput === this.isInputWord);
                const feedback = document.createElement('div');
                feedback.className = 'feedback-text-genially';

                if (isCorrect) {
                    correctAnswers++;
                    updateScoreCounter();
                    feedback.textContent = 'Верно! ✅';
                    feedback.classList.add('correct-feedback-genially');

                    const correctBtn = isInput ? answersContainer.children[0] : answersContainer.children[1];
                    correctBtn.classList.add('correct-answer-genially');

                    setTimeout(() => {
                        this.fadeOutAndRemove(popup);
                    }, 1500);
                } else {
                    incorrectAnswers++;
                    updateScoreCounter();
                    feedback.textContent = 'Ошибка! Попробуй ещё. ❌';
                    feedback.classList.add('incorrect-feedback-genially');

                    const incorrectBtn = isInput ? answersContainer.children[0] : answersContainer.children[1];
                    incorrectBtn.classList.add('incorrect-answer-genially');
                }

                const oldFeedback = answersContainer.querySelector('.feedback-text-genially');
                oldFeedback?.remove();
                answersContainer.appendChild(feedback);
            }

            fadeOutAndRemove(el) {
                if (!el || !el.parentNode) return;
                el.style.opacity = '0';
                setTimeout(() => { el.parentNode?.removeChild(el); }, 500);
            }
        }

        // === ЗАПУСК (теперь 100% рабочий) ===
        const container = document.getElementById('balloonContainer');
        if (!container) {
            console.error('Контейнер не найден');
            return;
        }

        createTwinklingStars(container);

        scoreCounterElement = createScoreCounter();
        container.appendChild(scoreCounterElement);

        // Ждём, пока DOM отрисуется, и размеры станут известны
        setTimeout(() => {
            const rect = container.getBoundingClientRect();
            const w = rect.width;
            const h = rect.height;

            if (w === 0 || h === 0) {
                console.error('Контейнер имеет нулевой размер');
                return;
            }

            function calculateBalloonPositions(count) {
                const positions = [];
                for (let i = 0; i < count; i++) {
                    let x, y;
                    let valid = false;
                    let attempts = 0;
                    while (!valid && attempts < 100) {
                        x = 80 + Math.random() * (w - 160);
                        y = 80 + Math.random() * (h - 160);
                        valid = true;
                        for (const p of positions) {
                            if (Math.hypot(x - p.x, y - p.y) < 130) {
                                valid = false;
                                break;
                            }
                        }
                        attempts++;
                    }
                    positions.push({ x, y });
                }
                return positions;
            }

            const positions = calculateBalloonPositions(30);

            for (let i = 0; i < 15; i++) {
                allBalloons.push(new BalloonWidget(container, positions[i].x, positions[i].y, i, true));
            }
            for (let i = 15; i < 30; i++) {
                allBalloons.push(new BalloonWidget(container, positions[i].x, positions[i].y, i, false));
            }

        }, 50); // Небольшая задержка для корректного layout
    }
})();
</script>

</body>
</html>
