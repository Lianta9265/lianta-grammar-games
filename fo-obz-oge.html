        correct: 3,
        level: 4
      },
      {
        question: "Что означает фразеологизм «час от часу не легче»?",
        answers: [
          "Время идёт очень медленно и тягуче",
          "Слишком медленное выздоровление",
          "Чем дальше, тем больше затруднений",
          "Время не лечит душевные раны"
        ],
        correct: 2,
        level: 4
      },
      {
        question: "Что означает выражение «язык не поворачивается»?",
        answers: [
          "Неразговорчивость, неумение общаться",
          "Серьёзные проблемы с речью и произношением",
          "Не хватает решимости что-то произнести",
          "Язык устал повторять одно и то же"
        ],
        correct: 2,
        level: 4
      },
      {
        question: "Что означает фразеологизм «поставить крест на чём-либо»?",
        answers: [
          "Пометить что-то крестиком в тетради",
          "Отказаться от дела как от безнадёжного",
          "Начать всё сначала",
          "Выделить главное место в тексте"
        ],
        correct: 1,
        level: 4
      }
    ];

    function getRandomQuestions(level, count = 20) {
      const levelQuestions = allPhraseologisms.filter(q => q.level === level);
      const shuffled = [...levelQuestions].sort(() => 0.5 - Math.random());
      return shuffled.slice(0, Math.min(count, levelQuestions.length));
    }

    function startGame(level) {
      currentLevel = level;
      currentQuestions = getRandomQuestions(level, 20);

      document.getElementById('startScreen').style.display = 'none';
      document.getElementById('gameScreen').style.display = 'block';
      currentQuestion = 0;
      selectedAnswer = -1;
      usedLifelines = { fiftyFifty: false, phoneCall: false, audienceHelp: false };

      document.getElementById('fiftyFifty').disabled = false;
      document.getElementById('phoneCall').disabled = false;
      document.getElementById('audienceHelp').disabled = false;

      loadQuestion();
    }

    function loadQuestion() {
      const question = currentQuestions[currentQuestion];
      const progress = ((currentQuestion + 1) / currentQuestions.length) * 100;

      document.getElementById('progressFill').style.width = progress + '%';
      document.getElementById('progressFill').textContent =
        `Вопрос ${currentQuestion + 1} из ${currentQuestions.length}`;
      document.getElementById('questionNumber').textContent = `Вопрос ${currentQuestion + 1}`;
      document.getElementById('questionText').textContent = question.question;

      const answerButtons = document.querySelectorAll('.answer-button');
      const letters = ['А', 'Б', 'В', 'Г'];

      answerButtons.forEach((button, index) => {
        button.textContent = `${letters[index]}) ${question.answers[index]}`;
        button.className = 'answer-button';
        button.style.display = 'block';
      });

      selectedAnswer = -1;
      document.getElementById('confirmButton').disabled = true;
    }

    function selectAnswer(index) {
      const answerButtons = document.querySelectorAll('.answer-button');

      answerButtons.forEach(button => {
        button.classList.remove('selected');
      });

      answerButtons[index].classList.add('selected');
      selectedAnswer = index;
      document.getElementById('confirmButton').disabled = false;
    }

    function confirmAnswer() {
      if (selectedAnswer === -1) return;

      const question = currentQuestions[currentQuestion];
      const answerButtons = document.querySelectorAll('.answer-button');

      // Подсветка
      answerButtons.forEach((button, index) => {
        if (index === question.correct) {
          button.classList.add('correct');
        } else if (index === selectedAnswer && index !== question.correct) {
          button.classList.add('incorrect');
        }
      });

      // Звук
      if (selectedAnswer === question.correct) {
        if (correctSound) {
          correctSound.currentTime = 0;
          correctSound.play().catch(() => {});
        }
      } else {
        if (wrongSound) {
          wrongSound.currentTime = 0;
          wrongSound.play().catch(() => {});
        }
      }

      setTimeout(() => {
        if (selectedAnswer === question.correct) {
          currentQuestion++;
          if (currentQuestion >= currentQuestions.length) {
            endGame(true);
          } else {
            loadQuestion();
          }
        } else {
          endGame(false);
        }
      }, 2000);
    }

    function endGame(won) {
      document.getElementById('gameScreen').style.display = 'none';
      document.getElementById('gameOver').style.display = 'block';

      const score = currentQuestion;
      const maxScore = currentQuestions.length;

      const levelNames = ['', 'Лёгкий', 'Средний', 'Сложный', 'Уровень 4'];
      document.getElementById('finalScore').textContent =
        `Уровень: ${levelNames[currentLevel]} • Результат: ${score} из ${maxScore}`;

      let message = '';
      if (won) {
        message = '🎉 Браво! Вы прошли все вопросы этого уровня!';
      } else if (score >= Math.floor(maxScore * 0.7)) {
        message = '👏 Отличный результат! Вы хорошо знаете фразеологизмы.';
      } else if (score >= Math.floor(maxScore * 0.4)) {
        message = '👍 Неплохо! Можно ещё немного потренироваться.';
      } else {
        message = '📚 Стоит повторить фразеологизмы — и попробовать ещё раз.';
      }

      document.getElementById('finalMessage').textContent = message;
    }

    function restartGame() {
      document.getElementById('gameOver').style.display = 'none';
      document.getElementById('startScreen').style.display = 'block';
    }

    function useFiftyFifty() {
      if (usedLifelines.fiftyFifty) return;

      usedLifelines.fiftyFifty = true;
      document.getElementById('fiftyFifty').disabled = true;

      const question = currentQuestions[currentQuestion];
      const answerButtons = document.querySelectorAll('.answer-button');
      const correctIndex = question.correct;

      let hiddenCount = 0;
      let indices = [0, 1, 2, 3];

      indices.splice(correctIndex, 1);

      while (hiddenCount < 2) {
        const randomIndex = Math.floor(Math.random() * indices.length);
        const buttonIndex = indices[randomIndex];
        answerButtons[buttonIndex].classList.add('hidden');
        indices.splice(randomIndex, 1);
        hiddenCount++;
      }
    }

    function usePhoneCall() {
      if (usedLifelines.phoneCall) return;

      usedLifelines.phoneCall = true;
      document.getElementById('phoneCall').disabled = true;

      const question = currentQuestions[currentQuestion];
      const correctIndex = question.correct;
      const letters = ['А', 'Б', 'В', 'Г'];

      const isCorrect = Math.random() < 0.7;
      let friendChoice;
      if (isCorrect) {
        friendChoice = correctIndex;
      } else {
        const wrongOptions = [0, 1, 2, 3].filter(i => i !== correctIndex);
        friendChoice = wrongOptions[Math.floor(Math.random() * wrongOptions.length)];
      }

      const advice = `Привет! Я думаю, что правильный ответ ${letters[friendChoice]}. ` +
        (isCorrect ? 'Я уверен в этом.' : 'Не совсем уверен, но это моё предположение.');

      document.getElementById('friendAdvice').textContent = advice;
      document.getElementById('phoneModal').style.display = 'block';
    }

    function useAudienceHelp() {
      if (usedLifelines.audienceHelp) return;

      usedLifelines.audienceHelp = true;
      document.getElementById('audienceHelp').disabled = true;

      const question = currentQuestions[currentQuestion];
      const correctIndex = question.correct;
      const letters = ['А', 'Б', 'В', 'Г'];

      let percentages = [0, 0, 0, 0];
      let remaining = 100;

      percentages[correctIndex] = 40 + Math.floor(Math.random() * 21);
      remaining -= percentages[correctIndex];

      for (let i = 0; i < 4; i++) {
        if (i !== correctIndex && remaining > 0) {
          const max = Math.min(remaining, 30);
          percentages[i] = Math.floor(Math.random() * max);
          remaining -= percentages[i];
        }
      }

      if (remaining > 0) {
        let randomIndex;
        do {
          randomIndex = Math.floor(Math.random() * 4);
        } while (randomIndex === correctIndex && remaining > 0);
        percentages[randomIndex] += remaining;
      }

      const pollDiv = document.getElementById('audiencePoll');
      pollDiv.innerHTML = '';

      letters.forEach((letter, index) => {
        const barDiv = document.createElement('div');
        barDiv.className = 'poll-bar';
        barDiv.innerHTML = `
          <div class="poll-percentage">${percentages[index]}%</div>
          <div>${letter}</div>
        `;
        pollDiv.appendChild(barDiv);
      });

      document.getElementById('audienceModal').style.display = 'block';
    }

    function closeModal(modalId) {
      document.getElementById(modalId).style.display = 'none';
    }
  </script>
</body>
</html>
