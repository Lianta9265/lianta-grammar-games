<!doctype html>
<html lang="ru" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Словопад</title>
  <script src="/_sdk/element_sdk.js"></script>
  <style>
    body { box-sizing: border-box; }
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100%;
    }

    .game-wrapper {
      width: 100%;
      height: 100%;
      position: relative;
      overflow: hidden;
    }

    .city-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #001a33 0%, #002244 40%, #003355 70%, #001122 100%);
    }

    .city-silhouette {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 40%;
      background: transparent;
    }

    .hills {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .hill {
      position: absolute;
      bottom: 0;
      background: #0d0d1a;
      border-radius: 50%;
    }

    .hill-back {
      width: 50%;
      height: 50%;
      left: -10%;
      opacity: 0.6;
    }

    .hill-mid {
      width: 60%;
      height: 60%;
      left: 25%;
      opacity: 0.75;
    }

    .hill-front {
      width: 45%;
      height: 70%;
      right: -5%;
      opacity: 0.9;
    }

    .trees {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 30%;
      display: flex;
      align-items: flex-end;
      justify-content: space-around;
      padding: 0 10%;
    }

    .tree {
      width: 0;
      height: 0;
      border-left: 15px solid transparent;
      border-right: 15px solid transparent;
      border-bottom: 60px solid #050510;
      position: relative;
      opacity: 0.8;
    }

    .tree::before {
      content: '';
      position: absolute;
      bottom: -65px;
      left: 50%;
      transform: translateX(-50%);
      width: 6px;
      height: 15px;
      background: #050510;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 70%;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      opacity: 0.8;
      animation: twinkle 3s infinite alternate;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 1; }
    }

    .game-container {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .header {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(10px);
      z-index: 30;
    }

    .title {
      font-size: 32px;
      font-weight: bold;
      color: white;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      white-space: nowrap;
    }

    .stats {
      display: flex;
      gap: 18px;
      align-items: center;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: white;
      min-width: 90px;
    }

    .stat-label {
      font-size: 12px;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: bold;
    }

    .correct { color: #4ade80; }
    .incorrect { color: #f87171; }

    .control-btn {
      padding: 10px 28px;
      background: #ef4444;
      color: white;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    .control-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 16px rgba(239, 68, 68, 0.4);
    }

    .control-btn.start {
      background: #10b981;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
    }

    .control-btn.start:hover {
      box-shadow: 0 6px 16px rgba(16, 185, 129, 0.4);
    }

    /* ✅ Таймер */
    .timer-btn{
      padding: 10px 18px;
      background: rgba(255,255,255,0.12);
      color: #fff;
      border: 2px solid rgba(255,255,255,0.35);
      border-radius: 25px;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
      transition: all 0.25s;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }
    .timer-btn:hover{
      transform: translateY(-2px);
      border-color: rgba(255,255,255,0.6);
    }
    .timer-btn.on{
      background: rgba(59,130,246,0.95);
      border-color: rgba(59,130,246,1);
      box-shadow: 0 6px 18px rgba(59,130,246,0.35);
    }

    /* Панель выбора частей речи — теперь в шапке */
    .task-switcher {
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 12px;
      border-radius: 12px;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6),
                  0 0 40px rgba(59, 130, 246, 0.4),
                  0 0 60px rgba(59, 130, 246, 0.2),
                  0 8px 32px rgba(0, 0, 0, 0.3);
      border: 2px solid rgba(59, 130, 246, 0.8);
      max-width: 520px;
      z-index: 40;
    }

    .task-label {
      font-size: 10px;
      color: #666;
      margin-bottom: 5px;
      text-align: left;
    }

    .task-buttons {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: flex-start;
    }

    /* ✅ Кнопки частей речи — вариант 2: ярче, контрастнее, «таблетки» */
    .task-btn {
      padding: 5px 18px; /* ширина увеличена, высота прежняя */
      min-width: 120px;

      background: linear-gradient(to bottom, #ffffff, #eef4ff);
      border: 2px solid #2563eb;
      color: #1e3a8a;

      border-radius: 15px;
      cursor: pointer;
      font-size: 11px;        /* чуть крупнее для глаз */
      font-weight: 700;       /* жирнее — лучше читается */
      letter-spacing: 0.02em; /* повышает различимость */

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.9),
        0 2px 6px rgba(37,99,235,0.25);

      transition: all 0.25s;
    }

    .task-btn:hover {
      transform: translateY(-2px);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,1),
        0 4px 10px rgba(37,99,235,0.35);
    }

    .task-btn.active {
      background: linear-gradient(to bottom, #3b82f6, #2563eb);
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.35);
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.35),
        0 4px 12px rgba(37,99,235,0.45);
    }

    .falling-words-area {
      position: absolute;
      top: 140px; /* будет выставлено JS по высоте шапки */
      left: 0;
      width: 100%;
      height: calc(100% - 140px);
      overflow: hidden;
      z-index: 5;
    }

    .falling-word {
      position: absolute;
      padding: 20px 50px;
      background: radial-gradient(ellipse at center, rgba(255, 255, 255, 0.95), rgba(240, 240, 255, 0.9));
      clip-path: polygon(
        50% 0%, 54% 20%, 70.7% 5%, 60% 25%, 95% 29.3%, 65% 40%,
        100% 50%, 65% 60%, 95% 70.7%, 60% 75%, 70.7% 95%, 54% 80%,
        50% 100%, 46% 80%, 29.3% 95%, 40% 75%, 5% 70.7%, 35% 60%,
        0% 50%, 35% 40%, 5% 29.3%, 40% 25%, 29.3% 5%, 46% 20%
      );
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: transform 0.2s, filter 0.2s;
      animation: fall linear;
      filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.9))
              drop-shadow(0 0 20px rgba(255, 215, 0, 0.6))
              drop-shadow(0 0 30px rgba(173, 216, 230, 0.4))
              drop-shadow(0 4px 10px rgba(0, 0, 0, 0.3));
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 200px;
      min-height: 100px;
      text-align: center;
      z-index: 6;
      pointer-events: auto;
    }

    .falling-word::before {
      content: '';
      position: absolute;
      top: -80px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 80px;
      background: linear-gradient(to bottom, transparent, rgba(255, 255, 255, 0.8));
      border-radius: 50%;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.6),
                  0 0 20px rgba(255, 255, 255, 0.4),
                  0 0 30px rgba(255, 255, 255, 0.2);
      pointer-events: none;
    }

    .falling-word::after {
      content: '';
      position: absolute;
      top: -100px;
      left: 50%;
      transform: translateX(-50%);
      width: 2px;
      height: 100px;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.3), transparent);
      border-radius: 50%;
      pointer-events: none;
    }

    .falling-word:hover {
      transform: scale(1.15) rotate(10deg);
      filter: drop-shadow(0 0 15px rgba(255, 255, 255, 1))
              drop-shadow(0 0 25px rgba(255, 215, 0, 0.8))
              drop-shadow(0 6px 15px rgba(0, 0, 0, 0.4));
    }

    @keyframes fall {
      from { top: -50px; }
      to { top: 110%; }
    }

    .game-over-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .game-over-content {
      background: white;
      padding: 40px;
      border-radius: 20px;
      text-align: center;
      max-width: 420px;
    }

    .game-over-title {
      font-size: 36px;
      color: #1a1a2e;
      margin-bottom: 20px;
    }

    .final-stats {
      margin: 20px 0;
      font-size: 18px;
      color: #666;
    }

    .restart-btn {
      padding: 15px 40px;
      background: #3b82f6;
      color: white;
      border: none;
      border-radius: 30px;
      font-size: 18px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .restart-btn:hover {
      background: #2563eb;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
    }

    /* ✅ Скрытый элемент для точности (нужен JS/тестам, но не показываем в интерфейсе) */
    #accuracy {
      display: none;
    }

    /* Мелкая адаптация — чтобы шапка красиво переносилась */
    @media (max-width: 900px) {
      .title { font-size: 26px; }
      .stat-value { font-size: 20px; }
      .stat-item { min-width: 80px; }
      .task-switcher { max-width: 100%; }
    }
  </style>

  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
  <script src="https://cdn.tailwindcss.com" type="text/javascript"></script>
</head>

<body class="h-full">
  <div class="game-wrapper">
    <div class="city-background">
      <div class="stars" id="stars"></div>
      <div class="city-silhouette">
        <div class="hills">
          <div class="hill hill-back"></div>
          <div class="hill hill-mid"></div>
          <div class="hill hill-front"></div>
        </div>
        <div class="trees">
          <div class="tree"></div>
          <div class="tree"></div>
          <div class="tree"></div>
          <div class="tree"></div>
          <div class="tree"></div>
          <div class="tree"></div>
        </div>
      </div>
    </div>

    <div class="game-container">
      <div class="header" id="header">
        <div class="title" id="gameTitle">Словопад</div>

        <div class="task-switcher" id="taskSwitcher">
          <div class="task-label">Найди:</div>
          <div class="task-buttons">
            <button class="task-btn active" data-task="Причастие">Причастие</button>
            <button class="task-btn" data-task="Деепричастие">Деепричастие</button>
            <button class="task-btn" data-task="Глагол">Глагол</button>
            <button class="task-btn" data-task="Наречие">Наречие</button>
            <button class="task-btn" data-task="Прилагательное">Прилагательное</button>
          </div>
        </div>

        <div class="stats" id="statsBar">
          <div class="stat-item">
            <div class="stat-label">Правильно</div>
            <div class="stat-value correct" id="correctCount">0</div>
          </div>

          <div class="stat-item">
            <div class="stat-label">Неправильно</div>
            <div class="stat-value incorrect" id="incorrectCount">0</div>
          </div>

          <!-- ✅ Скрытая точность (только для JS/тестов) -->
          <div id="accuracy">100%</div>

          <!-- ✅ Таймер 90 секунд (включается ДО старта) -->
          <div class="stat-item" style="min-width:auto;">
            <button class="timer-btn" id="timerBtn" type="button" aria-pressed="false" title="Авто-стоп через 90 секунд">
              ⏱ ТАЙМЕР: ВЫКЛ
            </button>
          </div>

          <div class="stat-item" style="min-width:auto;">
            <button class="control-btn start" id="controlBtn" type="button">СТАРТ</button>
          </div>
        </div>
      </div>

      <div class="falling-words-area" id="fallingWordsArea" aria-label="Игровое поле"></div>

      <div class="game-over-screen" id="gameOverScreen">
        <div class="game-over-content">
          <div class="game-over-title">Игра окончена!</div>
          <div class="final-stats">
            <div>Правильно: <span id="finalCorrect">0</span></div>
            <div>Неправильно: <span id="finalIncorrect">0</span></div>
            <div>Точность: <span id="finalAccuracy">0%</span></div>
          </div>
          <button class="restart-btn" id="restartBtn" type="button">Начать заново</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const defaultConfig = {
      game_title: "Словопад",
      instructions_text: "Найди:",
      background_color: "#001a33",
      surface_color: "#ffffff",
      text_color: "#333333",
      primary_action_color: "#3b82f6",
      secondary_action_color: "#4ade80"
    };

    const words = {
      "Глагол": ["Красить", "Играть", "Учить", "Образовать", "Танцевать", "Говорить", "Стараться", "Построить", "Решить", "Прочитать", "Увидеть", "Потереть"],
      "Причастие": ["Красящий", "Играющий", "Учащий", "Образующий", "Танцующий", "Говорящий", "Старающийся", "Построивший", "Решённый", "Прочитанный", "Видимый", "Стёртый", "Потёртый"],
      "Деепричастие": ["Покрасив", "Играя", "Выучив", "Образовав", "Танцуя", "Поговорив", "Стараясь", "Построив", "Решив", "Читая", "Увидев", "Потирая"],
      "Наречие": ["Красиво", "Игриво", "Учёно", "Образно", "Танцевально", "Говорливо", "Старательно", "Стройно", "Решительно", "Читабельно", "Видно", "Визуально"],
      "Прилагательное": ["Красивый", "Игровой", "Учебный", "Образный", "Танцевальный", "Разговорный", "Старательный", "Строительный", "Решительный", "Читательский", "Визуальный"]
    };

    let currentTask = "Причастие";
    let correctCount = 0;
    let incorrectCount = 0;
    let activeWords = [];
    let gameInterval;
    let wordSpawnInterval;
    let isGameRunning = false;

    // ✅ Таймер 90 секунд
    let timerEnabled = false;
    let timerTimeoutId = null;
    const TIMER_MS = 90 * 1000;

    function $(id) {
      return document.getElementById(id);
    }

    function assertExists(id) {
      const el = $(id);
      if (!el) {
        console.error(`[SelfTest] Не найден элемент #${id}`);
        return false;
      }
      return true;
    }

    // ✅ Автотесты
    function runSelfTests() {
      const ids = [
        'controlBtn',
        'timerBtn',
        'correctCount',
        'incorrectCount',
        'accuracy',
        'fallingWordsArea',
        'restartBtn',
        'gameTitle'
      ];
      const ok = ids.every(assertExists);
      if (!ok) return false;

      const mustBeParticiple = "Потёртый";
      if (!words["Причастие"].includes(mustBeParticiple)) {
        console.error(`[SelfTest] Ожидалось, что «${mustBeParticiple}» будет в категории «Причастие».`);
        return false;
      }

      // ✅ Доп. тесты: таймер = 90 секунд
      if (TIMER_MS !== 90000) {
        console.error(`[SelfTest] TIMER_MS должен быть 90000 (90 секунд), сейчас: ${TIMER_MS}`);
        return false;
      }

      // ✅ Доп. тест: у всех кнопок частей речи есть data-task
      const taskBtns = Array.from(document.querySelectorAll('.task-btn'));
      if (taskBtns.length < 5) {
        console.error(`[SelfTest] Ожидалось минимум 5 кнопок частей речи, сейчас: ${taskBtns.length}`);
        return false;
      }
      const missingDataset = taskBtns.some(b => !b.dataset || !b.dataset.task);
      if (missingDataset) {
        console.error('[SelfTest] Не у всех .task-btn задан data-task');
        return false;
      }

      const seen = new Map();
      for (const [cat, list] of Object.entries(words)) {
        for (const w of list) {
          if (seen.has(w)) {
            console.warn(`[SelfTest] Слово «${w}» встречается в двух категориях: «${seen.get(w)}» и «${cat}».`);
          } else {
            seen.set(w, cat);
          }
        }
      }

      console.log('[SelfTest] OK: базовые элементы, словарь, таймер, кнопки');
      return true;
    }

    function adjustFallingArea() {
      const header = document.querySelector('.header');
      const area = $('fallingWordsArea');
      if (!header || !area) return;
      const h = header.offsetHeight;
      area.style.top = h + 'px';
      area.style.height = `calc(100% - ${h}px)`;
    }

    function updateTimerUI() {
      const btn = $('timerBtn');
      if (!btn) return;
      btn.classList.toggle('on', timerEnabled);
      btn.textContent = timerEnabled ? '⏱ ТАЙМЕР: ВКЛ (90с)' : '⏱ ТАЙМЕР: ВЫКЛ';
      btn.setAttribute('aria-pressed', timerEnabled ? 'true' : 'false');
    }

    function clearTimer() {
      if (timerTimeoutId) {
        clearTimeout(timerTimeoutId);
        timerTimeoutId = null;
      }
    }

    function armTimerIfNeeded() {
      clearTimer();
      if (!timerEnabled) return;
      timerTimeoutId = setTimeout(() => {
        if (!isGameRunning) return;
        pauseGame();
      }, TIMER_MS);
    }

    function setupTimerButton() {
      const timerBtn = $('timerBtn');
      if (!timerBtn) return;

      timerBtn.addEventListener('click', () => {
        timerEnabled = !timerEnabled;
        updateTimerUI();

        // Если включили/выключили во время игры — поддерживаем
        if (isGameRunning) armTimerIfNeeded();
        else clearTimer();
      });

      updateTimerUI();
    }

    function init() {
      if (!runSelfTests()) return;

      createStars();
      setupTaskButtons();
      setupTimerButton();
      setupControlButton();

      isGameRunning = false;

      adjustFallingArea();
      window.addEventListener('resize', adjustFallingArea);

      updateStats();
    }

    function setupControlButton() {
      const controlBtn = $('controlBtn');
      controlBtn.addEventListener('click', () => {
        if (isGameRunning) {
          pauseGame();
        } else {
          startNewGame();
        }
      });
    }

    function pauseGame() {
      clearTimer();
      isGameRunning = false;
      clearInterval(wordSpawnInterval);
      clearInterval(gameInterval);

      const controlBtn = $('controlBtn');
      controlBtn.textContent = 'СТАРТ';
      controlBtn.classList.add('start');

      showGameStats();
    }

    function startNewGame() {
      hideGameStats();

      correctCount = 0;
      incorrectCount = 0;
      updateStats();

      // Удаляем все падающие слова
      activeWords.forEach(word => {
        if (word.element?.parentNode) word.element.parentNode.removeChild(word.element);
      });
      activeWords = [];

      const controlBtn = $('controlBtn');
      controlBtn.textContent = 'СТОП';
      controlBtn.classList.remove('start');

      isGameRunning = true;
      wordSpawnInterval = setInterval(spawnWord, 2000);
      gameInterval = setInterval(checkWords, 50);

      // ✅ Если включён таймер — авто-стоп через 90с
      armTimerIfNeeded();

      spawnWord();
    }

    function showGameStats() {
      const total = correctCount + incorrectCount;
      const accuracy = total === 0 ? 100 : Math.round((correctCount / total) * 100);

      let statsOverlay = document.getElementById('statsOverlay');
      if (statsOverlay) statsOverlay.remove();

      statsOverlay = document.createElement('div');
      statsOverlay.id = 'statsOverlay';
      statsOverlay.style.cssText = `
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 25;
        background: rgba(0,0,0,0.25);
        pointer-events: none;
      `;

      statsOverlay.innerHTML = `
        <div style="background:#fff; padding:40px; border-radius:20px; text-align:center; max-width:420px; box-shadow:0 10px 40px rgba(0,0,0,.3)">
          <div style="font-size: 32px; color: #1a1a2e; margin-bottom: 20px; font-weight: bold;">Статистика игры</div>
          <div style="margin: 20px 0; font-size: 20px; color: #666;">
            <div style="margin: 10px 0;">Правильно: <span style="color: #4ade80; font-weight: bold;">${correctCount}</span></div>
            <div style="margin: 10px 0;">Неправильно: <span style="color: #f87171; font-weight: bold;">${incorrectCount}</span></div>
            <div style="margin: 10px 0;">Точность: <span style="color: #3b82f6; font-weight: bold;">${accuracy}%</span></div>
          </div>
          <div style="font-size: 14px; color:#999;">Нажми «СТАРТ», чтобы начать заново</div>
        </div>
      `;

      document.querySelector('.game-container').appendChild(statsOverlay);
    }

    function hideGameStats() {
      const statsOverlay = document.getElementById('statsOverlay');
      if (statsOverlay) statsOverlay.remove();
    }

    function createStars() {
      const starsContainer = $('stars');
      if (!starsContainer) return;
      starsContainer.innerHTML = '';
      for (let i = 0; i < 100; i++) {
        const star = document.createElement('div');
        star.className = 'star';
        star.style.left = Math.random() * 100 + '%';
        star.style.top = Math.random() * 100 + '%';
        star.style.animationDelay = Math.random() * 3 + 's';
        starsContainer.appendChild(star);
      }
    }

    function setupTaskButtons() {
      const buttons = document.querySelectorAll('.task-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          buttons.forEach(b => {
            b.classList.remove('active');
            const primaryColor = window.elementSdk ? (window.elementSdk.config.primary_action_color || defaultConfig.primary_action_color) : defaultConfig.primary_action_color;
            const surfaceColor = window.elementSdk ? (window.elementSdk.config.surface_color || defaultConfig.surface_color) : defaultConfig.surface_color;
            b.style.background = surfaceColor;
            b.style.color = primaryColor;
          });

          btn.classList.add('active');
          const primaryColor = window.elementSdk ? (window.elementSdk.config.primary_action_color || defaultConfig.primary_action_color) : defaultConfig.primary_action_color;
          const surfaceColor = window.elementSdk ? (window.elementSdk.config.surface_color || defaultConfig.surface_color) : defaultConfig.surface_color;
          btn.style.background = primaryColor;
          btn.style.color = surfaceColor;
          currentTask = btn.dataset.task;
        });
      });
    }

    function spawnWord() {
      if (!isGameRunning) return;

      const categories = Object.keys(words);
      const randomCategory = categories[Math.floor(Math.random() * categories.length)];
      const categoryWords = words[randomCategory];
      const randomWord = categoryWords[Math.floor(Math.random() * categoryWords.length)];

      const wordElement = document.createElement('div');
      wordElement.className = 'falling-word';
      wordElement.textContent = randomWord;
      wordElement.dataset.category = randomCategory;
      wordElement.style.left = (Math.random() * 80 + 10) + '%';

      const duration = 8000 + Math.random() * 4000;
      wordElement.style.animationDuration = duration + 'ms';

      wordElement.addEventListener('click', (e) => {
        e.stopPropagation();
        handleWordClick(wordElement, randomCategory);
      });

      $('fallingWordsArea').appendChild(wordElement);
      activeWords.push({ element: wordElement, startTime: Date.now(), duration: duration });
    }

    function handleWordClick(element, category) {
      if (!isGameRunning) return;

      if (category === currentTask) {
        correctCount++;
        element.style.background = 'rgba(74, 222, 128, 0.95)';
      } else {
        incorrectCount++;
        element.style.background = 'rgba(248, 113, 113, 0.95)';
      }

      setTimeout(() => {
        if (element?.parentNode) element.parentNode.removeChild(element);
      }, 200);

      activeWords = activeWords.filter(w => w.element !== element);
      updateStats();
    }

    function checkWords() {
      const currentTime = Date.now();
      activeWords = activeWords.filter(word => {
        const elapsed = currentTime - word.startTime;
        if (elapsed >= word.duration) {
          if (word.element?.parentNode) word.element.parentNode.removeChild(word.element);
          return false;
        }
        return true;
      });
    }

    function updateStats() {
      $('correctCount').textContent = String(correctCount);
      $('incorrectCount').textContent = String(incorrectCount);

      const total = correctCount + incorrectCount;
      const accuracy = total === 0 ? 100 : Math.round((correctCount / total) * 100);
      const accEl = $('accuracy');
      if (accEl) accEl.textContent = accuracy + '%';
    }

    $('restartBtn').addEventListener('click', () => {
      $('gameOverScreen').style.display = 'none';

      activeWords.forEach(word => {
        if (word.element?.parentNode) word.element.parentNode.removeChild(word.element);
      });
      activeWords = [];

      hideGameStats();

      // ✅ Сброс таймера при рестарте
      clearTimer();
      timerEnabled = false;
      updateTimerUI();

      startNewGame();
    });

    async function onConfigChange(config) {
      const gameTitle = config.game_title || defaultConfig.game_title;
      const backgroundColor = config.background_color || defaultConfig.background_color;
      const surfaceColor = config.surface_color || defaultConfig.surface_color;
      const textColor = config.text_color || defaultConfig.text_color;
      const primaryActionColor = config.primary_action_color || defaultConfig.primary_action_color;
      const secondaryActionColor = config.secondary_action_color || defaultConfig.secondary_action_color;

      $('gameTitle').textContent = gameTitle;

      const cityBackground = document.querySelector('.city-background');
      cityBackground.style.background = `linear-gradient(180deg, ${backgroundColor} 0%, ${backgroundColor}dd 50%, ${backgroundColor}aa 100%)`;

      const taskSwitcher = $('taskSwitcher');
      taskSwitcher.style.background = `${surfaceColor}f0`;
      taskSwitcher.style.borderColor = primaryActionColor;
      taskSwitcher.style.boxShadow = `0 0 20px ${primaryActionColor}99, 0 0 40px ${primaryActionColor}66, 0 0 60px ${primaryActionColor}33, 0 8px 32px rgba(0, 0, 0, 0.3)`;

      const taskLabel = document.querySelector('.task-label');
      taskLabel.style.color = textColor;

      const taskButtons = document.querySelectorAll('.task-btn');
      taskButtons.forEach(btn => {
        btn.style.borderColor = primaryActionColor;
        btn.style.color = primaryActionColor;
        if (btn.classList.contains('active')) {
          btn.style.background = primaryActionColor;
          btn.style.color = surfaceColor;
        } else {
          btn.style.background = surfaceColor;
        }
      });

      $('correctCount').style.color = secondaryActionColor;

      const restartBtn = $('restartBtn');
      restartBtn.style.background = primaryActionColor;

      const controlBtn = $('controlBtn');
      if (controlBtn.classList.contains('start')) {
        controlBtn.style.background = secondaryActionColor;
      } else {
        controlBtn.style.background = '#ef4444';
      }
    }

    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.surface_color || defaultConfig.surface_color,
              set: (value) => {
                config.surface_color = value;
                window.elementSdk.setConfig({ surface_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.primary_action_color || defaultConfig.primary_action_color,
              set: (value) => {
                config.primary_action_color = value;
                window.elementSdk.setConfig({ primary_action_color: value });
              }
            },
            {
              get: () => config.secondary_action_color || defaultConfig.secondary_action_color,
              set: (value) => {
                config.secondary_action_color = value;
                window.elementSdk.setConfig({ secondary_action_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: undefined,
          fontSizeable: undefined
        }),
        mapToEditPanelValues: (config) => new Map([
          ["game_title", config.game_title || defaultConfig.game_title],
          ["instructions_text", config.instructions_text || defaultConfig.instructions_text]
        ])
      });
    }

    init();
  </script>
