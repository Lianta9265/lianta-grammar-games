<!doctype html>
<html lang="ru" class="h-full">
 <head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Новогодний Доббль</title>
  <script src="/_sdk/element_sdk.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      background: #0047AB !important;
    }
    
    html, body {
      height: 100%;
    }
    
    #app-wrapper {
      background: #0047AB !important;
    }
    
    .snowflake {
      position: fixed;
      top: -10px;
      z-index: 1;
      color: #ffffff;
      font-size: 20px;
      opacity: 0.9;
      animation: fall linear infinite;
      pointer-events: none;
    }
    
    @keyframes fall {
      to {
        transform: translateY(100%);
        top: 100%;
      }
    }
    
    .card {
      width: 420px;
      height: 420px;
      border-radius: 50%;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 30px;
      transition: transform 0.3s ease;
      z-index: 10;
      background: #ffffff;
      border: 8px solid #FF1493;
      box-shadow: 0 0 30px rgba(255, 20, 147, 0.6), 0 0 60px rgba(0, 71, 171, 0.4), inset 0 0 20px rgba(255, 20, 147, 0.1);
    }
    
    .card:hover {
      transform: scale(1.05);
    }
    
    .word {
      font-size: 18px;
      margin: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      user-select: none;
      cursor: pointer;
      transition: all 0.2s ease;
      text-align: center;
      font-weight: 500;
    }
    
    .word:hover {
      transform: scale(1.15);
      font-weight: 700;
    }
    
    .word.matched {
      animation: pulse 0.5s ease;
    }
    
    .word.error {
      animation: shake 0.5s ease;
    }
    
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
    
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    
    .success-message {
      animation: fadeInOut 2s ease;
    }
    
    @keyframes fadeInOut {
      0%, 100% { opacity: 0; }
      10%, 90% { opacity: 1; }
    }
    
    .score-board {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px 40px;
      border-radius: 20px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      z-index: 10;
      border: 4px solid #FF1493;
      box-shadow: 0 0 25px rgba(255, 20, 147, 0.5), 0 4px 20px rgba(0, 0, 0, 0.2), inset 0 0 15px rgba(255, 20, 147, 0.05);
    }
    
    #game-title {
      color: #FF1493;
      text-shadow: -2px -2px 0 #003366, 2px -2px 0 #003366, -2px 2px 0 #003366, 2px 2px 0 #003366;
    }
    
    #instruction-text {
      color: #FF1493;
    }
    
    #new-game-btn {
      background: #dc2626;
      color: #ffffff;
    }
    
    #success-message {
      color: #FF1493;
    }
    
    #game-over-message {
      color: #FF1493;
    }
  </style>
  <style>@view-transition { navigation: auto; }</style>
  <script src="/_sdk/data_sdk.js" type="text/javascript"></script>
 </head>
 <body class="h-full">
  <div id="snowflakes-container"></div>
  <div id="app-wrapper" class="h-full w-full overflow-auto">
   <div class="min-h-full w-full flex flex-col items-center justify-center p-8">
    <h1 id="game-title" class="text-5xl font-bold mb-4 text-center z-10">🎄 Новогодний Доббль: ЛЖЕВВОДНЫЕ связи ✨</h1>
    <p id="instruction-text" class="text-xl mb-6 text-center z-10">🎁 Найдите одинаковое слово на обеих карточках! 🎅</p>
    <div class="score-board mb-6 flex gap-8">
     <div class="text-center">
      <div id="score-label" class="text-lg font-semibold">
       ⭐ Очки
      </div>
      <div id="score-value" class="text-4xl font-bold">
       0
      </div>
     </div>
     <div class="text-center">
      <div id="errors-label" class="text-lg font-semibold">
       ❌ Ошибки
      </div>
      <div id="errors-value" class="text-4xl font-bold">
       0
      </div>
     </div>
     <div class="text-center">
      <div id="final-label" class="text-lg font-semibold">
       🏆 Итого
      </div>
      <div id="final-value" class="text-4xl font-bold">
       0
      </div>
     </div>
    </div>
    <div id="success-message" class="success-message text-2xl font-bold mb-4 h-8 z-10"></div>
    <div class="flex gap-12 mb-8 flex-wrap justify-center">
     <div id="card1" class="card shadow-2xl"></div>
     <div id="card2" class="card shadow-2xl"></div>
    </div><button id="new-game-btn" class="px-8 py-4 text-xl font-semibold rounded-lg shadow-lg transition-all duration-200 z-10"> 🎮 Новая игра 🎯 </button>
    <div id="game-over-message" class="text-3xl font-bold mt-6 z-10" style="display: none;"></div>
   </div>
  </div>
  <script>
    const words = [
      'вдобавок', 'к тому же', 'всё-таки', 'тем не менее', 'между тем', 
      'в связи с этим', 'в связи с чем', 'при всём при том', 'в то же время', 
      'то есть', 'в довершение', 'в конечном счёте', 'в результате', 
      'в итоге', 'всё равно', 'в первую очередь', 'притом', 'причём', 'в конце концов'
    ];
    
    const defaultConfig = {
      game_title: '🎄 Новогодний Доббль: ЛЖЕВВОДНЫЕ связи ✨',
      instruction_text: '🎁 Найдите одинаковое слово на обеих карточках! 🎅',
      new_game_button: '🎮 Новая игра 🎯',
      score_label: '⭐ Очки',
      errors_label: '❌ Ошибки',
      final_label: '🏆 Итого',
      background_color: '#0047AB',
      card_color: '#ffffff',
      text_color: '#1e293b',
      title_color: '#FF1493',
      button_color: '#dc2626',
      word_bg_color: '#ffffff',
      word_color: '#FF1493',
      font_family: 'Arial',
      font_size: 16
    };
    
    let gameState = {
      usedWords: [],
      score: 0,
      errors: 0,
      currentGame: null,
      isGameOver: false
    };
    
    function createSnowflakes() {
      const container = document.getElementById('snowflakes-container');
      container.innerHTML = '';
      
      for (let i = 0; i < 30; i++) {
        const snowflake = document.createElement('div');
        snowflake.className = 'snowflake';
        snowflake.textContent = '❄';
        snowflake.style.left = Math.random() * 100 + '%';
        snowflake.style.animationDuration = (Math.random() * 3 + 5) + 's';
        snowflake.style.animationDelay = Math.random() * 5 + 's';
        snowflake.style.fontSize = (Math.random() * 15 + 15) + 'px';
        container.appendChild(snowflake);
      }
    }
    
    function getRandomWords(count, exclude = []) {
      const available = words.filter(w => !exclude.includes(w) && !gameState.usedWords.includes(w));
      if (available.length === 0) return [];
      const shuffled = [...available].sort(() => Math.random() - 0.5);
      return shuffled.slice(0, count);
    }
    
    function generateCards() {
      if (gameState.isGameOver) return;
      
      const availableMatching = words.filter(w => !gameState.usedWords.includes(w));
      if (availableMatching.length === 0) {
        endGame();
        return;
      }
      
      const matchingWord = availableMatching[Math.floor(Math.random() * availableMatching.length)];
      
      const allAvailableWords = words.filter(w => w !== matchingWord);
      const shuffled = [...allAvailableWords].sort(() => Math.random() - 0.5);
      const card1Extra = shuffled.slice(0, 4);
      const card2Extra = shuffled.slice(4, 8);
      
      const card1Words = [matchingWord, ...card1Extra].sort(() => Math.random() - 0.5);
      const card2Words = [matchingWord, ...card2Extra].sort(() => Math.random() - 0.5);
      
      gameState.currentGame = { card1Words, card2Words, matchingWord };
      renderCards();
    }
    
    function renderCards() {
      const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
      const wordBgColor = config.word_bg_color || defaultConfig.word_bg_color;
      const wordColor = config.word_color || defaultConfig.word_color;
      
      const card1 = document.getElementById('card1');
      const card2 = document.getElementById('card2');
      
      card1.innerHTML = gameState.currentGame.card1Words.map(word => 
        `<span class="word" data-word="${word}" style="background: ${wordBgColor}; color: ${wordColor}; text-shadow: -1px -1px 0 #003366, 1px -1px 0 #003366, -1px 1px 0 #003366, 1px 1px 0 #003366; font-weight: 700; letter-spacing: 1px; font-size: 27px;">${word}</span>`
      ).join('');
      
      card2.innerHTML = gameState.currentGame.card2Words.map(word => 
        `<span class="word" data-word="${word}" style="background: ${wordBgColor}; color: ${wordColor}; text-shadow: -1px -1px 0 #003366, 1px -1px 0 #003366, -1px 1px 0 #003366, 1px 1px 0 #003366; font-weight: 700; letter-spacing: 1px; font-size: 27px;">${word}</span>`
      ).join('');
      
      document.querySelectorAll('.word').forEach(el => {
        el.addEventListener('click', handleWordClick);
      });
    }
    
    function handleWordClick(event) {
      if (gameState.isGameOver) return;
      
      const clickedWord = event.target.dataset.word;
      
      if (clickedWord === gameState.currentGame.matchingWord) {
        document.querySelectorAll(`[data-word="${clickedWord}"]`).forEach(el => {
          el.classList.add('matched');
        });
        
        gameState.usedWords.push(clickedWord);
        gameState.score++;
        updateScore();
        
        const successMessage = document.getElementById('success-message');
        successMessage.textContent = '🎉 Правильно! 🎉';
        successMessage.style.opacity = '1';
        
        setTimeout(() => {
          successMessage.style.opacity = '0';
          generateCards();
        }, 1500);
      } else {
        event.target.classList.add('error');
        gameState.errors++;
        updateScore();
        
        setTimeout(() => {
          event.target.classList.remove('error');
        }, 500);
      }
    }
    
    function updateScore() {
      const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
      const textColor = config.text_color || defaultConfig.text_color;
      
      document.getElementById('score-value').textContent = gameState.score;
      document.getElementById('errors-value').textContent = gameState.errors;
      document.getElementById('final-value').textContent = gameState.score - gameState.errors;
      
      document.getElementById('score-value').style.color = textColor;
      document.getElementById('errors-value').style.color = textColor;
      document.getElementById('final-value').style.color = textColor;
    }
    
    function endGame() {
      gameState.isGameOver = true;
      const config = window.elementSdk ? window.elementSdk.config : defaultConfig;
      const titleColor = config.title_color || defaultConfig.title_color;
      
      const gameOverMessage = document.getElementById('game-over-message');
      const finalScore = gameState.score - gameState.errors;
      gameOverMessage.textContent = `🎄 Игра завершена! Ваш финальный счёт: ${finalScore} из ${words.length} 🎄`;
      gameOverMessage.style.color = titleColor;
      gameOverMessage.style.display = 'block';
      
      document.getElementById('card1').innerHTML = '';
      document.getElementById('card2').innerHTML = '';
    }
    
    function resetGame() {
      gameState = {
        usedWords: [],
        score: 0,
        errors: 0,
        currentGame: null,
        isGameOver: false
      };
      
      document.getElementById('game-over-message').style.display = 'none';
      updateScore();
      generateCards();
    }
    
    async function onConfigChange(config) {
      const baseSize = config.font_size || defaultConfig.font_size;
      const customFont = config.font_family || defaultConfig.font_family;
      const fontStack = `${customFont}, Arial, sans-serif`;
      
      document.body.style.background = config.background_color || defaultConfig.background_color;
      
      const appWrapper = document.getElementById('app-wrapper');
      appWrapper.style.background = config.background_color || defaultConfig.background_color;
      
      const title = document.getElementById('game-title');
      title.textContent = config.game_title || defaultConfig.game_title;
      title.style.color = config.title_color || defaultConfig.title_color;
      title.style.fontFamily = fontStack;
      title.style.fontSize = `${baseSize * 3}px`;
      title.style.textShadow = `-2px -2px 0 #003366, 2px -2px 0 #003366, -2px 2px 0 #003366, 2px 2px 0 #003366`;
      
      const instruction = document.getElementById('instruction-text');
      instruction.textContent = config.instruction_text || defaultConfig.instruction_text;
      instruction.style.color = config.title_color || defaultConfig.title_color;
      instruction.style.fontFamily = fontStack;
      instruction.style.fontSize = `${baseSize * 1.25}px`;
      
      const successMessage = document.getElementById('success-message');
      successMessage.style.color = config.title_color || defaultConfig.title_color;
      successMessage.style.fontFamily = fontStack;
      successMessage.style.fontSize = `${baseSize * 1.5}px`;
      
      const scoreLabel = document.getElementById('score-label');
      scoreLabel.textContent = config.score_label || defaultConfig.score_label;
      scoreLabel.style.color = config.text_color || defaultConfig.text_color;
      scoreLabel.style.fontFamily = fontStack;
      scoreLabel.style.fontSize = `${baseSize * 1.125}px`;
      
      const errorsLabel = document.getElementById('errors-label');
      errorsLabel.textContent = config.errors_label || defaultConfig.errors_label;
      errorsLabel.style.color = config.text_color || defaultConfig.text_color;
      errorsLabel.style.fontFamily = fontStack;
      errorsLabel.style.fontSize = `${baseSize * 1.125}px`;
      
      const finalLabel = document.getElementById('final-label');
      finalLabel.textContent = config.final_label || defaultConfig.final_label;
      finalLabel.style.color = config.text_color || defaultConfig.text_color;
      finalLabel.style.fontFamily = fontStack;
      finalLabel.style.fontSize = `${baseSize * 1.125}px`;
      
      const card1 = document.getElementById('card1');
      const card2 = document.getElementById('card2');
      card1.style.background = config.card_color || defaultConfig.card_color;
      card2.style.background = config.card_color || defaultConfig.card_color;
      
      const button = document.getElementById('new-game-btn');
      button.textContent = config.new_game_button || defaultConfig.new_game_button;
      button.style.background = config.button_color || defaultConfig.button_color;
      button.style.color = config.card_color || defaultConfig.card_color;
      button.style.fontFamily = fontStack;
      button.style.fontSize = `${baseSize * 1.25}px`;
      
      updateScore();
      
      if (gameState.currentGame) {
        renderCards();
      }
    }
    
    document.getElementById('new-game-btn').addEventListener('click', resetGame);
    
    if (window.elementSdk) {
      window.elementSdk.init({
        defaultConfig,
        onConfigChange,
        mapToCapabilities: (config) => ({
          recolorables: [
            {
              get: () => config.background_color || defaultConfig.background_color,
              set: (value) => {
                config.background_color = value;
                window.elementSdk.setConfig({ background_color: value });
              }
            },
            {
              get: () => config.card_color || defaultConfig.card_color,
              set: (value) => {
                config.card_color = value;
                window.elementSdk.setConfig({ card_color: value });
              }
            },
            {
              get: () => config.text_color || defaultConfig.text_color,
              set: (value) => {
                config.text_color = value;
                window.elementSdk.setConfig({ text_color: value });
              }
            },
            {
              get: () => config.button_color || defaultConfig.button_color,
              set: (value) => {
                config.button_color = value;
                window.elementSdk.setConfig({ button_color: value });
              }
            },
            {
              get: () => config.word_color || defaultConfig.word_color,
              set: (value) => {
                config.word_color = value;
                window.elementSdk.setConfig({ word_color: value });
              }
            }
          ],
          borderables: [],
          fontEditable: {
            get: () => config.font_family || defaultConfig.font_family,
            set: (value) => {
              config.font_family = value;
              window.elementSdk.setConfig({ font_family: value });
            }
          },
          fontSizeable: {
            get: () => config.font_size || defaultConfig.font_size,
            set: (value) => {
              config.font_size = value;
              window.elementSdk.setConfig({ font_size: value });
            }
          }
        }),
        mapToEditPanelValues: (config) => new Map([
          ['game_title', config.game_title || defaultConfig.game_title],
          ['instruction_text', config.instruction_text || defaultConfig.instruction_text],
          ['new_game_button', config.new_game_button || defaultConfig.new_game_button],
          ['score_label', config.score_label || defaultConfig.score_label],
          ['errors_label', config.errors_label || defaultConfig.errors_label],
          ['final_label', config.final_label || defaultConfig.final_label]
        ])
      });
      
      onConfigChange(window.elementSdk.config);
    }
    
    createSnowflakes();
    generateCards();
  </script>
